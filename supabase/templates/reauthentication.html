<!doctype html>
<html lang="fa" dir="rtl">
<body dir="rtl" style="margin:0;padding:0;background:#fffff0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:#162238">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background:#fffff0"><tr><td align="center" style="padding:44px 20px 52px">
  <table role="presentation" dir="rtl" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%;max-width:560px;margin:0 auto;text-align:right;font-family:'Segoe UI',Tahoma,Arial,sans-serif">
    <tr><td style="padding:0 0 36px">
      <table role="presentation" dir="rtl" cellpadding="0" cellspacing="0" border="0"><tr>
        <td style="vertical-align:middle"><img src="https://jobamooz.com/logo-mark.png" width="48" height="48" alt="" style="display:block;border:0;border-radius:10px"></td>
        <td style="vertical-align:middle;padding-right:12px;font-size:24px;font-weight:bold;color:#162238">جاب‌آموز</td>
      </tr></table>
    </td></tr>
    <tr><td style="padding:0 0 18px;font-size:30px;line-height:1.5;font-weight:bold;color:#162238">کد تأیید</td></tr>
    <tr><td style="padding:0 0 6px;font-size:17px;line-height:2;color:#162238">سلام{{ if .Data.full_name }} {{ .Data.full_name }}{{ end }}،</td></tr>
    <tr><td style="padding:0 0 14px;font-size:17px;line-height:2;color:#162238">کد تأیید: <strong style="font-size:20px;letter-spacing:2px;direction:ltr;unicode-bidi:embed">{{ .Token }}</strong></td></tr>
    
    
    <tr><td style="padding:16px 0 0;font-size:14px;line-height:1.9;color:#4a566b">اگر این درخواست از تو نبوده است، این ایمیل را نادیده بگیر.</td></tr>
    <tr><td style="padding:32px 0 0;font-size:17px;line-height:1.9;color:#162238">با احترام،<br>جاب‌آموز</td></tr>
    <tr><td style="padding:28px 0 0">
      <div style="border-top:1px solid #dfe3d6;padding-top:16px;font-size:13px;line-height:1.8;color:#4a566b">
        این ایمیل به دلیل حساب تو در جاب‌آموز فرستاده شده است.
        <a href="https://jobamooz.com" style="color:#4a566b">jobamooz.com</a>
      </div>
    </td></tr>
  </table>
  </td></tr></table>
</body>
</html>
