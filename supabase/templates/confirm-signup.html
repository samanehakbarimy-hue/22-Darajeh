<!doctype html>
<html lang="fa" dir="rtl">
<body dir="rtl" style="margin:0;padding:24px 12px;background:#f6f4f2;font-family:Tahoma,Arial,sans-serif;color:#141110">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%;max-width:520px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px">
    <tr><td style="font-size:20px;font-weight:bold;padding-bottom:4px">جاب‌آموز</td></tr>
    <tr><td style="font-size:17px;font-weight:bold;padding:16px 0 8px">ایمیل را تأیید کن</td></tr>
    <tr><td style="font-size:15px;line-height:1.9;color:#141110;padding-bottom:16px">
      <div>یک قدم مانده تا حساب جاب‌آموز فعال شود. روی دکمه پایین بزن.</div>
      <div style="margin-top:12px">اگر لینک باز نشد، همین آدرس را در مرورگر کپی کن:</div>
      <div style="margin-top:6px;font-size:12px;color:#6b6560;word-break:break-all;direction:ltr;text-align:left">{{ .ConfirmationURL }}</div>
    </td></tr>
    <tr><td style="padding:8px 0 4px">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#20917e;color:#0a1c19;text-decoration:none;padding:12px 28px;border-radius:999px;font-weight:bold;font-size:15px">تأیید ایمیل</a>
    </td></tr>
    <tr><td style="font-size:12px;line-height:1.8;color:#6b6560;padding-top:24px;border-top:1px solid #eee;margin-top:16px">
      اگر تو در جاب‌آموز ثبت‌نام نکرده‌ای، این پیام را نادیده بگیر — تا وقتی روی لینک زده نشود هیچ حسابی فعال نمی‌شود.
    </td></tr>
  </table>
</body>
</html>
